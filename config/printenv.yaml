# ==============================================================================
# cadloop 边界条件配置（printenv）
# ------------------------------------------------------------------------------
# 本文件是「物理现实」的唯一真相源。建模与仿真**必须**通过 cadloop.config 读取本文件，
# 不得在代码里硬编码打印机/耗材/公差数字。
#
# ⚠️ calibrated: false 的含义：
#    材料参数与公差为**典型值/待实测值**。config 层会据此拒绝输出
#    「强度合格」「可装配」这类结论性判定（只输出参考值并标注可信度）。
#    待 T1（公差试件）与 T2（材料试件）实测后更新本文件并置为 true。
# ==============================================================================

meta:
  name: H2D-PLA-2026
  version: "0.2.0"
  updated: "2026-09-10"
  owner: 少爷
  # ---------------------------------------------------------------------------
  # 标定策略（决定结论可以怎么说话）
  # ---------------------------------------------------------------------------
  # conservative_fallback : 不实测，直接用**保守兜底值**（注塑标准值 × 80%，
  #                         层间再 × 50%），并叠加 SF=2.0 双重保守。
  #                         在此策略下结论**可以**作为设计依据，但必须标注
  #                         「基于保守估计」；且当安全裕度落在敏感区时通道会
  #                         主动要求实测（见 robustness 判据）。
  # measured              : 已用实测值替换（T2 试件），confidence 提升为 medium/high。
  calibration:
    strategy: conservative_fallback
    confidence: low
    basis: "注塑 PLA 标准值 × 0.80；层间再 × 0.50；SF = 2.0"
    note: "保守兜底：即使实际材料只有估计值的 50%，安全系数仍 ≈ 1.0，不坏。"
  note: "采用保守兜底策略；安全裕度落在敏感区（1.5 ≤ S < 2.5）的零件会被要求实测复核。"

# ------------------------------------------------------------------------------
# 打印机：拓竹 H2D（官方参数，2026-09-10 自官网核录）
# ------------------------------------------------------------------------------
printer:
  model: Bambu Lab H2D
  build_volume_mm:
    single_nozzle:          [325, 320, 325]
    dual_nozzle_intersect:  [300, 320, 320]   # 双喷嘴同时使用时的安全幅面
    dual_nozzle_union:      [350, 320, 320]
  active_build_volume: dual_nozzle_intersect  # ← 设计时以此为准
  nozzle_diameter_mm: 0.4
  available_nozzles_mm: [0.2, 0.4, 0.6, 0.8]
  layer_height_mm:
    draft: 0.28
    default: 0.20
    fine: 0.12
  max_volumetric_flow_mm3_s: 40.0
  plate: textured_PEI
  max_chamber_temp_c: 65.0
  # ⚠️ 以下两项待助教确认后填写；null = 未知（config 层会拒绝相关判定）
  xy_hole_compensation_mm: null    # Bambu Studio「XY 孔补偿」当前设定值
  max_single_print_hours: null     # 单次打印时长上限（决定能否过夜打印）
  remote_camera: true

# ------------------------------------------------------------------------------
# 耗材：PLA —— 保守兜底值（未实测，按策略计算得出）
# ------------------------------------------------------------------------------
# 取值依据：注塑 PLA 标准值 × 0.80（FDM 打印件普遍弱于注塑件），
#          层间再 × 0.50（层间结合是 FDM 头号失效模式）。
# ⚠️ 层间**不能**沿用层内的 80%——那会高估 2 倍，因为层间结合强度与层内
#    强度是两个不同的物理量（前者由层间分子扩散决定，强烈依赖温度与时间）。
# 若将来实测（T2 试件）替换，请同时把 meta.calibration.strategy 改为 measured。
material:
  name: PLA
  density_g_cm3: 1.24
  # 各向异性：层平面内(XY) 与 层间(Z) 必须区分
  E_xy_mpa: 2400.0            # = 3000 × 0.80
  E_z_mpa: 1200.0             # = 2400 × 0.50（层间模量折减）
  poisson_xy: 0.35
  yield_xy_mpa: 40.0          # = 50 × 0.80   → 许用 20.0 MPa @SF=2.0
  yield_z_mpa: 20.0           # = 40 × 0.50   → 许用 10.0 MPa @SF=2.0
  ultimate_xy_mpa: 44.0       # = 55 × 0.80
  ultimate_z_mpa: 22.0        # = 44 × 0.50
  tg_c: 58.0                  # 玻璃化转变温度（电机附近温升约束）
  thermal_conductivity_w_mk: 0.13
  creep_model: ignored        # 少爷钦定：作品只用一学期，蠕变不作约束

# ------------------------------------------------------------------------------
# 可打印性红线（建模时强制施加，不是事后检查）
# ------------------------------------------------------------------------------
# 取值来源：earthtojake/text-to-cad 的 `dfam-check/references/process-limits.md`
#          （FDM/FFF 列）。该表引自 Hubs / Formlabs / HP MJF / EOS 工艺设计指南，
#          并与 ISO/ASTM 52910 §6.5（特征极限）、§6.7（支撑结构）体例一致。
# ⚠️ 2026-09-13 修正：本文件此前用的是**比行业标准更宽松**的自估值
#    （壁厚 0.8 vs 1.2、悬垂 60° vs 45°、孔径 1.5 vs 2.0），会放过真实缺陷。
#    若机器/材料数据表给出更严的值，以数据表为准并在此注明。
design_rules:
  min_wall_mm: 1.2             # 有支撑最小壁厚（FDM 标准值）
  min_wall_unsupported_mm: 1.6 # 无支撑最小壁厚（垂直悬空壁，比有支撑更严）
  min_feature_mm: 0.8          # 最小正特征（凸起/筋）
  min_hole_dia_mm: 2.0         # 最小可成型孔径
  min_pin_dia_mm: 3.0          # 结构用销轴下限（本机自定，非工艺极限）
  max_overhang_deg: 45.0       # 自支撑角，自水平面量起（< 此角需支撑）
  max_bridge_mm: 10.0          # 最大无支撑桥接跨度
  split_threshold_mm: 300.0    # 单件任一维超过即强制分件（双喷嘴交集幅面）
  min_clearance_mm: 0.25       # 运动件最小间隙（本机自定）

# ------------------------------------------------------------------------------
# 配合公差（⚠️ 全部待 T1 试件实测标定）
# ------------------------------------------------------------------------------
fits:
  calibrated: false
  rotating_clearance_mm: 0.20   # 单边
  sliding_clearance_mm: 0.15
  press_fit_mm: -0.05           # 过盈为负
  snap_fit_clearance_mm: 0.30

# ------------------------------------------------------------------------------
# 标准件库（100 元预算内；建模时用 cadloop.geom 的标准件函数调用）
# ------------------------------------------------------------------------------
hardware:
  budget_cny: 100.0
  budget_note: "组内自费；耗材由课程提供"
  bearings:
    - {name: MR63ZZ, bore_mm: 3.0, od_mm: 6.0,  width_mm: 2.5, price_cny: 1.0}
    - {name: MR83ZZ, bore_mm: 3.0, od_mm: 8.0,  width_mm: 3.0, price_cny: 1.2}
    - {name: 608ZZ,  bore_mm: 8.0, od_mm: 22.0, width_mm: 7.0, price_cny: 1.5}
  screws: ["M3"]
  heat_insert: "M3"
  magnets:
    - {name: D6x2, od_mm: 6.0, thickness_mm: 2.0, price_cny: 0.10}

# ------------------------------------------------------------------------------
# 物理现实条件
# ------------------------------------------------------------------------------
physics:
  gravity_mm_s2: 9806.65
  safety_factor: 2.0            # ← 从 1.5 提到 2.0：额外一倍余量用于吸收材料参数不确定性
  ambient_temp_c: 25.0
  friction_pla_pla: 0.40
  motors:
    # ⚠️ 2026-09-13 更正：**电机数量不受限**——少爷只约束了总成本（100 元），
    #    此前把「有个电机得了」误解为单电机硬约束，并据此否掉了多个可行方案。
    #    电机很便宜（TT 马达 4 元 / N20 12 元 / 370 8 元），标准件才是大头。
    #    这里列出候选供选型；`count` 只是"示例配置"，不是上限。
    - {name: TT,  count: 2, stall_torque_nmm: 15.0,  no_load_rpm: 200, voltage_v: 6.0, price_cny: 4.0}
    - {name: N20, count: 2, stall_torque_nmm: 30.0,  no_load_rpm: 200, voltage_v: 6.0, price_cny: 12.0}
    - {name: N30, count: 2, stall_torque_nmm: 60.0,  no_load_rpm: 150, voltage_v: 6.0, price_cny: 18.0}
    - {name: "370", count: 1, stall_torque_nmm: 100.0, no_load_rpm: 300, voltage_v: 6.0, price_cny: 8.0}

# ------------------------------------------------------------------------------
# 验证容差（借鉴 Forge 的「音叉」思路：用解析解当管线健康判据）
# ------------------------------------------------------------------------------
verification:
  require_bench_pass: true      # 音叉不过 → pipeline 拒绝输出零件结论
  static_tol: 0.08              # 静力：与解析解相对误差容差 8%
  modal_tol: 0.08
  buckling_tol: 0.10
  thermal_tol: 0.05
  mesh_convergence_tol: 0.02    # 网格收敛：加密一倍后结果变化 <2%
